steps:
    # Build the container image
    - name: "gcr.io/cloud-builders/docker"
      args:
          [
              "build",
              "-t",
              "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/tbe-api:${SHORT_SHA}",
              "."
          ]
      dir: "."

    # Push the container image to Artifact Registry
    - name: "gcr.io/cloud-builders/docker"
      args:
          [
              "push",
              "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/tbe-api:${SHORT_SHA}"
          ]

    # Deploy container image to Cloud Run
    - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
      entrypoint: gcloud
      args:
          - "run"
          - "deploy"
          - "${_SERVICE_NAME}"
          - "--image"
          - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/tbe-api:${SHORT_SHA}"
          - "--region"
          - "${_REGION}"
          - "--platform"
          - "managed"
          - "--allow-unauthenticated"
          - "--set-env-vars"
          - "NODE_ENV=production"
          - "--memory"
          - "1Gi"
          - "--cpu"
          - "1"
          - "--min-instances"
          - "0"
          - "--max-instances"
          - "10"
          - "--concurrency"
          - "80"
          - "--timeout"
          - "300s"
          - "--port"
          - "3000"

# Substitution variables (can be overridden in triggers)
substitutions:
    _REGION: "us-central1"
    _REPOSITORY: "tbe-api-repo"
    _SERVICE_NAME: "tbe-api"

# Build options
options:
    logging: CLOUD_LOGGING_ONLY
    machineType: "E2_HIGHCPU_8"

# Build timeout
timeout: "1200s"

# Tags for the build
tags:
    - "tbe-api"
    - "${BRANCH_NAME}"
    - "${SHORT_SHA}"
