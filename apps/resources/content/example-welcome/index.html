<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to TBE Resources</title>
    <style>
      .welcome-wrap {
        max-width: 40rem;
        margin: 0 auto;
        line-height: 1.6;
      }
      .welcome-wrap h1 {
        font-size: 1.75rem;
        margin-bottom: 0.75rem;
        color: #fafafa;
      }
      .welcome-wrap p {
        color: #d4d4d8;
        margin-bottom: 1rem;
      }
      .welcome-card {
        border: 1px solid #3f3f46;
        border-radius: 0.5rem;
        padding: 1rem 1.25rem;
        background: rgba(24, 24, 27, 0.6);
      }
      @media (max-width: 640px) {
        .welcome-wrap h1 {
          font-size: 1.35rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="welcome-wrap">
      <h1>Welcome</h1>
      <div class="welcome-card">
        <p>
          This page is authored as a standalone HTML file in the repo. After deploy, it is
          embedded on the resources site so search engines see the full text on your URL.
        </p>
        <p>
          Interns: copy <code>content/_template</code>, edit <code>index.html</code> and
          <code>meta.json</code>, then open a PR.
        </p>
      </div>
    </div>
  </body>
</html>
