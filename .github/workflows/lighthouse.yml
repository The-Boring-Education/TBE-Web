name: Lighthouse SEO Audit

on:
    # Run on pushes to production, development branch
    push:
        branches: [production, development]

    schedule:
        - cron: "0 6 * * 1"

    # Allow manual trigger
    workflow_dispatch:
        inputs:
            app:
                description: "Specific app to audit (leave empty for all)"
                required: false
                default: ""
                type: choice
                options:
                    - ""
                    - platform
                    - prepYatra
                    - quizes
                    - resumeYatra
                    - dsayatra
                    - techyatra
                    - oncampus

# Prevent multiple workflows from running simultaneously
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lighthouse:
        name: SEO & Accessibility Audit
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9.15.9
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "pnpm"

            - name: Get pnpm store directory
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

            - name: Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Create LHCI output directory
              run: mkdir -p apps/testing/.lhci

            - name: Run Lighthouse CI
              env:
                  LHCI_ENV: production
                  LHCI_APP: ${{ github.event.inputs.app }}
              run: |
                  echo "Running Lighthouse CI audit..."
                  echo "Target app: ${{ github.event.inputs.app || 'all apps' }}"
                  npx lhci autorun --config=lighthouserc.js || true

            - name: Upload Lighthouse Reports
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: lighthouse-reports-${{ github.run_number }}
                  path: apps/testing/.lhci
                  retention-days: 30

            - name: Generate Summary
              if: always()
              run: |
                  echo "## Lighthouse SEO Audit Results" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Audit Details" >> $GITHUB_STEP_SUMMARY
                  echo "- **Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Target App:** ${{ github.event.inputs.app || 'All apps' }}" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Reports" >> $GITHUB_STEP_SUMMARY
                  echo "Lighthouse reports have been uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
                  echo "Download them from the Actions tab to view detailed results." >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Score Thresholds" >> $GITHUB_STEP_SUMMARY
                  echo "| Category | Minimum Score |" >> $GITHUB_STEP_SUMMARY
                  echo "|----------|---------------|" >> $GITHUB_STEP_SUMMARY
                  echo "| SEO | 85% (error) |" >> $GITHUB_STEP_SUMMARY
                  echo "| Accessibility | 80% (warning) |" >> $GITHUB_STEP_SUMMARY
                  echo "| Best Practices | 75% (warning) |" >> $GITHUB_STEP_SUMMARY
                  echo "| Performance | 50% (warning) |" >> $GITHUB_STEP_SUMMARY

            - name: Comment on PR (if applicable)
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const path = require('path');
                      
                      // Find manifest file
                      const lhciDir = 'apps/testing/.lhci';
                      let summary = 'Lighthouse audit completed. Check artifacts for detailed reports.';
                      
                      try {
                        const manifestPath = path.join(lhciDir, 'manifest.json');
                        if (fs.existsSync(manifestPath)) {
                          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
                          const results = manifest.map(entry => {
                            const scores = entry.summary || {};
                            return `| ${entry.url} | ${Math.round((scores.seo || 0) * 100)}% | ${Math.round((scores.accessibility || 0) * 100)}% |`;
                          });
                          
                          summary = `### Lighthouse SEO Audit Results\n\n| URL | SEO | Accessibility |\n|-----|-----|---------------|\n${results.join('\n')}`;
                        }
                      } catch (e) {
                        console.log('Could not read manifest:', e.message);
                      }
                      
                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: summary
                      });

