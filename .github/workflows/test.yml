name: 🧪 Testing Pipeline

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [development, production]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: 🧪 Unit Tests
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    uses: ./.github/workflows/test-unit.yml
    secrets: inherit

  integration-tests:
    name: 🔌 Integration Tests
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    uses: ./.github/workflows/test-integration.yml
    secrets: inherit

  e2e-tests:
    name: 🎭 E2E Tests (All Apps)
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    uses: ./.github/workflows/test-e2e.yml
    secrets: inherit

  test-summary:
    name: 📊 Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()

    steps:
      - name: 📊 Testing Results Summary
        run: |
          echo "## 🧪 Testing Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Unit Tests" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.unit-tests.result }}" == "success" ]; then
            echo "✅ **PASSED**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.unit-tests.result }}" == "skipped" ]; then
            echo "⏭️ **SKIPPED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAILED**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Integration Tests" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.integration-tests.result }}" == "success" ]; then
            echo "✅ **PASSED**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.integration-tests.result }}" == "skipped" ]; then
            echo "⏭️ **SKIPPED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAILED**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### E2E Tests (Per App Matrix)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "✅ **PASSED**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.e2e-tests.result }}" == "skipped" ]; then
            echo "⏭️ **SKIPPED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAILED**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          UNIT="${{ needs.unit-tests.result }}"
          INTG="${{ needs.integration-tests.result }}"
          E2E="${{ needs.e2e-tests.result }}"

          if [ "$UNIT" == "success" ] && [ "$INTG" == "success" ] && [ "$E2E" == "success" ]; then
            echo "🎉 All testing checks passed! Ready for merge." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "$UNIT" == "skipped" ] && [ "$INTG" == "skipped" ] && [ "$E2E" == "skipped" ]; then
            echo "⏭️ All tests skipped (Draft PR)." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "❌ One or more testing checks failed. Please fix before merge." >> $GITHUB_STEP_SUMMARY
          exit 1
