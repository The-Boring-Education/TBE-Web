name: 🧪 Test Suite

on:
    push:
        branches: [development, production]
    pull_request:
        branches: [development, production]
        types: [opened, synchronize, reopened, ready_for_review]

# Prevent multiple workflows from running simultaneously
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Shared setup steps
    setup:
        name: Setup Environment
        runs-on: ubuntu-latest
        outputs:
            cache-hit: ${{ steps.cache.outputs.cache-hit }}
        steps:
            - name: 📥 Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9.15.9
                  run_install: false

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "pnpm"

            - name: 🔍 Get pnpm store directory
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

            - name: 🗂️ Setup pnpm cache
              id: cache
              uses: actions/cache@v4
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: 📦 Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: 🏗️ Build Packages
              run: |
                  echo "Building shared packages first..."
                  pnpm run build --filter=@tbe/constants --filter=@tbe/types --filter=@tbe/utils --filter=@tbe/interface --filter=@tbe/services --filter=@tbe/components --filter=@tbe/hooks --filter=@tbe/auth

    # Unit Tests Job
    unit-tests:
        name: 🧪 Unit Tests
        runs-on: ubuntu-latest
        needs: setup

        # Skip draft PRs
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

        steps:
            - name: 📥 Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9.15.9
                  run_install: false

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "pnpm"

            - name: 🔍 Get pnpm store directory
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

            - name: 🗂️ Restore pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: 📦 Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: 🏗️ Build Packages
              run: |
                  echo "Building shared packages..."
                  pnpm run build --filter=@tbe/constants --filter=@tbe/types --filter=@tbe/utils --filter=@tbe/interface --filter=@tbe/services --filter=@tbe/components --filter=@tbe/hooks --filter=@tbe/auth

            - name: 🧪 Run Unit Tests
              run: |
                  echo "Running unit tests..."
                  pnpm --filter @tbe/testing test:unit

            - name: 📊 Unit Test Summary
              if: always()
              run: |
                  if [ ${{ job.status }} == 'success' ]; then
                    echo "✅ Unit tests passed!"
                  else
                    echo "❌ Unit tests failed!"
                    exit 1
                  fi

    # E2E Tests Job
    e2e-tests:
        name: 🎭 E2E Tests
        runs-on: ubuntu-latest
        needs: setup

        # Skip draft PRs
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)

        steps:
            - name: 📥 Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9.15.9
                  run_install: false

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "pnpm"

            - name: 🔍 Get pnpm store directory
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

            - name: 🗂️ Restore pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: 📦 Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: 🏗️ Build Packages
              run: |
                  echo "Building shared packages..."
                  pnpm run build --filter=@tbe/constants --filter=@tbe/types --filter=@tbe/utils --filter=@tbe/interface --filter=@tbe/services --filter=@tbe/components --filter=@tbe/hooks --filter=@tbe/auth

            - name: 🎭 Install Playwright Browsers
              run: |
                  cd apps/testing
                  pnpm playwright:install --with-deps

            - name: 🚀 Start Dev Servers
              run: |
                  echo "Starting development servers for E2E tests..."
                  
                  # Install curl if not available
                  sudo apt-get update && sudo apt-get install -y curl || true
                  
                  # Start servers in background with proper environment
                  export NODE_ENV=development
                  export CI=true
                  
                  # Start platform server
                  cd ${{ github.workspace }}
                  pnpm dev:platform > /tmp/platform.log 2>&1 &
                  PLATFORM_PID=$!
                  echo "PLATFORM_PID=$PLATFORM_PID" >> $GITHUB_ENV
                  
                  # Start prep-yatra server
                  pnpm dev:prep-yatra > /tmp/prep-yatra.log 2>&1 &
                  PREP_YATRA_PID=$!
                  echo "PREP_YATRA_PID=$PREP_YATRA_PID" >> $GITHUB_ENV
                  
                  # Start API server
                  pnpm dev:api > /tmp/api.log 2>&1 &
                  API_PID=$!
                  echo "API_PID=$API_PID" >> $GITHUB_ENV
                  
                  # Wait for servers to be ready
                  echo "Waiting for servers to start..."
                  timeout=180
                  elapsed=0
                  
                  while [ $elapsed -lt $timeout ]; do
                    platform_ready=false
                    prep_yatra_ready=false
                    api_ready=false
                    
                    if curl -f http://localhost:3000 > /dev/null 2>&1; then
                      platform_ready=true
                    fi
                    
                    if curl -f http://localhost:3001 > /dev/null 2>&1; then
                      prep_yatra_ready=true
                    fi
                    
                    if curl -f http://localhost:3004/api/health > /dev/null 2>&1; then
                      api_ready=true
                    fi
                    
                    if [ "$platform_ready" = true ] && [ "$prep_yatra_ready" = true ] && [ "$api_ready" = true ]; then
                      echo "✅ All servers are ready!"
                      break
                    fi
                    
                    sleep 3
                    elapsed=$((elapsed + 3))
                    echo "Waiting... ($elapsed/$timeout seconds) - Platform: $platform_ready, PrepYatra: $prep_yatra_ready, API: $api_ready"
                  done
                  
                  if [ $elapsed -ge $timeout ]; then
                    echo "❌ Servers failed to start in time"
                    echo "=== Platform logs ==="
                    tail -100 /tmp/platform.log || true
                    echo "=== Prep Yatra logs ==="
                    tail -100 /tmp/prep-yatra.log || true
                    echo "=== API logs ==="
                    tail -100 /tmp/api.log || true
                    exit 1
                  fi
                  
                  # Give servers a moment to fully initialize
                  sleep 5

            - name: 🎭 Run E2E Tests
              env:
                CI: true
                NEXTAUTH_URL: http://localhost:3000
                PLATFORM_URL: http://localhost:3000
                NEXT_PUBLIC_PREPYATRA_BASE_URL: http://localhost:3001
                PREP_YATRA_URL: http://localhost:3001
                PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
              run: |
                  echo "Running E2E tests..."
                  cd apps/testing
                  pnpm test:e2e
              
            - name: 📤 Upload Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: apps/testing/test-results/
                  retention-days: 7

            - name: 🛑 Stop Dev Servers
              if: always()
              run: |
                  echo "Stopping dev servers..."
                  if [ ! -z "$PLATFORM_PID" ]; then
                    kill $PLATFORM_PID 2>/dev/null || true
                  fi
                  if [ ! -z "$PREP_YATRA_PID" ]; then
                    kill $PREP_YATRA_PID 2>/dev/null || true
                  fi
                  if [ ! -z "$API_PID" ]; then
                    kill $API_PID 2>/dev/null || true
                  fi
                  pkill -f "next dev" || true
                  pkill -f "node.*3000" || true
                  pkill -f "node.*3001" || true
                  pkill -f "node.*3004" || true

            - name: 📊 E2E Test Summary
              if: always()
              run: |
                  if [ ${{ job.status }} == 'success' ]; then
                    echo "✅ E2E tests passed!"
                  else
                    echo "❌ E2E tests failed!"
                    echo "Check the uploaded test results for details."
                    exit 1
                  fi

    # Test Summary Job
    test-summary:
        name: 📊 Test Summary
        runs-on: ubuntu-latest
        needs: [unit-tests, e2e-tests]
        if: always()

        steps:
            - name: 📊 Test Results Summary
              run: |
                  echo "## 🧪 Test Suite Results" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Unit Tests" >> $GITHUB_STEP_SUMMARY
                  if [ "${{ needs.unit-tests.result }}" == "success" ]; then
                    echo "✅ **PASSED**" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "❌ **FAILED**" >> $GITHUB_STEP_SUMMARY
                  fi
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### E2E Tests" >> $GITHUB_STEP_SUMMARY
                  if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
                    echo "✅ **PASSED**" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "❌ **FAILED**" >> $GITHUB_STEP_SUMMARY
                  fi
                  echo "" >> $GITHUB_STEP_SUMMARY
                  
                  if [ "${{ needs.unit-tests.result }}" == "success" ] && [ "${{ needs.e2e-tests.result }}" == "success" ]; then
                    echo "🎉 All tests passed! Ready for merge." >> $GITHUB_STEP_SUMMARY
                    exit 0
                  else
                    echo "❌ Some tests failed. Please fix the issues before merging." >> $GITHUB_STEP_SUMMARY
                    exit 1
                  fi
