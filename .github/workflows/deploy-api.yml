name: Deploy API to Cloud Run

on:
    push:
        branches:
            - main
            - development
        paths:
            - "apps/api/**"
            - "packages/**"
            - "pnpm-lock.yaml"
    workflow_dispatch:
        inputs:
            environment:
                description: "Deployment environment"
                required: true
                default: "staging"
                type: choice
                options:
                    - staging
                    - production

env:
    PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    REGION: asia-south1
    REPOSITORY: tbe-api-repo

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            api-changed: ${{ steps.changes.outputs.api }}
        steps:
            - uses: actions/checkout@v4
            - uses: dorny/paths-filter@v3
              id: changes
              with:
                  filters: |
                      api:
                        - 'apps/api/**'
                        - 'packages/**'
                        - 'pnpm-lock.yaml'

    build-and-deploy:
        needs: changes
        if: needs.changes.outputs.api-changed == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9.15.9

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build packages
              run: |
                  pnpm run build --filter=@tbe/constants
                  pnpm run build --filter=@tbe/types
                  pnpm run build --filter=@tbe/utils
                  pnpm run build --filter=@tbe/database
                  pnpm run build --filter=@tbe/interface
                  pnpm run build --filter=@tbe/services

            - name: Lint API
              run: pnpm run lint --filter=@tbe/api

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.GCP_SA_KEY }}

            - name: Set up Cloud SDK
              uses: google-github-actions/setup-gcloud@v2

            - name: Configure Docker to use gcloud as a credential helper
              run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

            - name: Determine deployment environment
              id: env
              run: |
                  if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
                    echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
                  elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
                    echo "environment=production" >> $GITHUB_OUTPUT
                  else
                    echo "environment=staging" >> $GITHUB_OUTPUT
                  fi

            - name: Set service name based on environment
              id: service
              run: |
                  if [ "${{ steps.env.outputs.environment }}" == "production" ]; then
                    echo "name=tbe-api" >> $GITHUB_OUTPUT
                  else
                    echo "name=tbe-api-staging" >> $GITHUB_OUTPUT
                  fi

            - name: Build Docker image
              run: |
                  docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/tbe-api:${{ github.sha }} .
                  docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/tbe-api:latest .

            - name: Push Docker image
              run: |
                  docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/tbe-api:${{ github.sha }}
                  docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/tbe-api:latest

            - name: Deploy to Cloud Run
              run: |
                  gcloud run deploy ${{ steps.service.outputs.name }} \
                    --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/tbe-api:${{ github.sha }} \
                    --region ${{ env.REGION }} \
                    --platform managed \
                    --allow-unauthenticated \
                    --memory 1Gi \
                    --cpu 1 \
                    --min-instances 0 \
                    --max-instances 10 \
                    --concurrency 80 \
                    --timeout 300s \
                    --port 3000 \
                    --set-env-vars NODE_ENV=production \
                    --set-secrets MONGODB_URI=mongodb-uri:latest,NEXTAUTH_SECRET=nextauth-secret:latest,GOOGLE_AUTH_CLIENT_SECRET=google-auth-client-secret:latest,ADMIN_SECRET=admin-secret:latest,OPENAI_API_KEY=openai-api-key:latest,YOUTUBE_API_KEY=youtube-api-key:latest,CASHFREE_SECRET_KEY=cashfree-secret-key:latest,EMAIL_API_KEY=email-api-key:latest,SENTRY_AUTH_TOKEN=sentry-auth-token:latest

            - name: Get Cloud Run URL
              id: url
              run: |
                  URL=$(gcloud run services describe ${{ steps.service.outputs.name }} --region ${{ env.REGION }} --format 'value(status.url)')
                  echo "service_url=$URL" >> $GITHUB_OUTPUT

            - name: Test deployment
              run: |
                  sleep 30  # Wait for deployment to be ready
                  curl -f ${{ steps.url.outputs.service_url }}/api/health || exit 1

            - name: Create deployment summary
              run: |
                  echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
                  echo "- **Environment:** ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Service:** ${{ steps.service.outputs.name }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **URL:** ${{ steps.url.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Image:** ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/tbe-api:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Health Check:** ✅ Passed" >> $GITHUB_STEP_SUMMARY
