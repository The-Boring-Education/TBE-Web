name: 🔍 Code Quality Check

on:
    pull_request:
        branches: [development, production]
        types: [opened, synchronize, reopened, ready_for_review]

# Prevent multiple workflows from running simultaneously
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint & Type Check
        runs-on: ubuntu-latest

        # Skip draft PRs
        if: github.event.pull_request.draft == false

        steps:
            - name: 📥 Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: 📦 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "pnpm"

            - name: 📦 Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9.15.9
                  run_install: false

            - name: 🔍 Get pnpm store directory
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

            - name: 🗂️ Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            - name: 📦 Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: 🔍 Run ESLint
              run: |
                  echo "Running ESLint across all packages and applications..."
                  pnpm run lint

            - name: 🔍 Run Type Checking
              run: |
                  echo "Running TypeScript type checking..."
                  pnpm run check-types

            - name: 🎨 Check Code Formatting
              run: |
                  echo "Checking code formatting with Prettier..."
                  pnpm exec prettier --check "**/*.{ts,tsx,md}" || {
                    echo "❌ Code formatting issues found!"
                    echo "💡 Run 'pnpm run format' to fix formatting issues"
                    exit 1
                  }

            - name: ✅ Lint Success
              run: |
                  echo "✅ All code quality checks passed!"
                  echo "🔍 Completed checks:"
                  echo "  - ESLint (code quality & best practices)"
                  echo "  - TypeScript (type safety)"
                  echo "  - Prettier (code formatting)"

            - name: 📊 Quality Summary
              if: always()
              run: |
                  if [ ${{ job.status }} == 'success' ]; then
                    echo "🎉 Code quality checks passed! Code is ready for review."
                  else
                    echo "❌ Code quality issues found! Please fix before merging."
                    echo "💡 Common fixes:"
                    echo "  - Run 'pnpm run lint' to see ESLint issues"
                    echo "  - Run 'pnpm run format' to fix formatting"
                    echo "  - Check TypeScript errors in your IDE"
                    exit 1
                  fi
