name: 🏗️ Build Check

on:
  pull_request:
    branches: [development, production]
    types: [opened, synchronize, reopened, ready_for_review]

# Prevent multiple workflows from running simultaneously
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build shared packages first (dependencies for apps)
  build-packages:
    name: 📦 Build Shared Packages
    runs-on: ubuntu-latest

    # Skip draft PRs
    if: github.event.pull_request.draft == false

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: 🔍 Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 🗂️ Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Shared Packages
        run: |
          echo "Building shared packages..."
          pnpm run build --filter=@tbe/constants --filter=@tbe/types --filter=@tbe/utils --filter=@tbe/interface --filter=@tbe/services --filter=@tbe/components --filter=@tbe/hooks --filter=@tbe/auth

      - name: 📦 Cache Built Packages
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            node_modules/.cache
          key: packages-build-${{ github.sha }}

  # Build apps in parallel using matrix strategy
  build-apps:
    name: 🏗️ Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: build-packages

    # Skip draft PRs
    if: github.event.pull_request.draft == false

    strategy:
      # Don't cancel other matrix jobs if one fails
      fail-fast: false
      matrix:
        app:
          - platform
          - prep-yatra
          - quizes
          - onboarding
          - api
          - techyatra
          - dsayatra
          - resume-yatra
          - oncampus
          - testing

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: 🔍 Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 🗂️ Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📦 Restore Built Packages Cache
        uses: actions/cache@v4
        with:
          path: |
            packages/*/dist
            node_modules/.cache
          key: packages-build-${{ github.sha }}

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build ${{ matrix.app }}
        run: |
          echo "Building @tbe/${{ matrix.app }}..."
          pnpm run build:${{ matrix.app }}

  # Summary job to check if all builds passed
  build-summary:
    name: 📊 Build Summary
    runs-on: ubuntu-latest
    needs: [build-packages, build-apps]
    if: always()

    steps:
      - name: 📊 Check Build Results
        run: |
          echo "## 🏗️ Build Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          pkg="${{ needs.build-packages.result }}"
          apps="${{ needs.build-apps.result }}"

          # Treat skipped as OK — draft PRs intentionally skip builds to save CI resources
          if ([ "$pkg" == "success" ] || [ "$pkg" == "skipped" ]) && \
             ([ "$apps" == "success" ] || [ "$apps" == "skipped" ]); then
            echo "### ✅ All Builds Passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Shared packages built successfully" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ All applications built successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 Build completed successfully! Ready for merge." >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$pkg" != "success" ] && [ "$pkg" != "skipped" ]; then
              echo "- ❌ Shared packages build failed" >> $GITHUB_STEP_SUMMARY
            fi
            if [ "$apps" != "success" ] && [ "$apps" != "skipped" ]; then
              echo "- ❌ One or more application builds failed" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please fix the build errors before merging." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
