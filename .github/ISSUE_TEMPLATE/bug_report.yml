name: Bug Report
description: Report a bug or issue with the TBE-Web project.
title: "[BUG] - Brief description of the issue"
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue! Please fill out the sections below.

  - type: input
    id: title
    attributes:
      label: Title
      description: Provide a concise title for the issue.
      placeholder: "Bug in [specific functionality] when [specific action]"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug in detail, including steps to reproduce it.
      placeholder: "Provide a clear and detailed explanation of the issue."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the issue.
      placeholder: "1. Go to...\n2. Click on...\n3. Observe..."
    validations:
      required: true

  - type: input
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "Expected [specific outcome] when [specific action]"
    validations:
      required: true

  - type: input
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: "Actual behavior: [unexpected outcome]"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Select the environment where the issue occurs.
      options:
        - "Development"
        - "Production"
        - "Staging"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Provide links to screenshots or recordings, if applicable.
      placeholder: "Attach screenshots or videos here."

  - type: input
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
      placeholder: "Additional details..."
